name: Playwright nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  playwright:
    name: E2E Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: |
          dotnet build community/src/Server/ForgeDeck.Server/ForgeDeck.Server.csproj -c Release -p:IncludeEnterprise=true
          dotnet build community/tests/E2E.Playwright.Tests/E2E.Playwright.Tests.csproj -c Release
      - name: Install Playwright browsers
        run: pwsh community/tests/E2E.Playwright.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps
      - name: Test
        run: dotnet test community/tests/E2E.Playwright.Tests/E2E.Playwright.Tests.csproj -c Release --no-build
