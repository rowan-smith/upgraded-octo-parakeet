<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ForgeDeck — a modular software delivery platform.">
  <title>ForgeDeck · Atlas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=topbar-stable-2">
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
      <div class="topbar-leading">
        <a class="topbar-brand" href="#/home" data-route="/home" aria-label="ForgeDeck home">
          <span class="topbar-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M2 11.5L8 3l6 8.5H2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M5 11.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </span>
          <strong>ForgeDeck</strong>
        </a>
        <div class="breadcrumbs" id="breadcrumbs">ForgeDeck</div>
      </div>
      <label class="global-search" for="globalSearch">
        <span class="search-glyph" aria-hidden="true">⌕</span>
        <input id="globalSearch" type="search" placeholder="Search projects, pipelines, issues, or people…" readonly>
        <kbd>Ctrl K</kbd>
      </label>
      <div class="top-actions">
        <div class="user-menu" id="userMenuWrap">
          <button class="user-chip" id="userMenu" type="button" aria-label="User menu" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar" id="userAvatar">?</span>
            <span class="user-copy"><strong id="userName">User</strong><small id="userHandle">@user</small></span>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown" role="menu" hidden>
            <button type="button" role="menuitem" data-user-action="profile">Profile</button>
            <button type="button" role="menuitem" data-user-action="theme">Theme</button>
            <button type="button" role="menuitem" data-user-action="settings">Settings</button>
            <hr>
            <button type="button" role="menuitem" class="danger" value="signout" data-user-action="signout">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="shell-body">
      <aside class="sidebar" id="appSidebar">
        <button class="context-card" id="contextButton" aria-label="Switch project">
          <span class="context-avatar" id="projectAvatar">A</span>
          <span class="context-copy"><small id="orgLabel">Organisation</small><strong id="projectLabel">Project</strong></span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <nav id="primaryNav" aria-label="Project navigation"></nav>
        <div class="sidebar-footer">
          <button type="button" class="nav-item" data-route="/people"><span class="nav-icon">◎</span>People</button>
          <button type="button" class="nav-item" data-route="/audit"><span class="nav-icon">◫</span>Audit log</button>
          <button type="button" class="nav-item" data-route="/modules"><span class="nav-icon">◇</span>Modules</button>
        </div>
      </aside>

      <div class="workspace">
        <main id="content" class="content"><div class="loading"><span></span>Loading workspace…</div></main>
      </div>
    </div>
  </div>

  <dialog id="modal" class="modal"><form method="dialog" id="modalForm"><div id="modalBody"></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js?v=topbar-full-1" defer></script>
</body>
</html>
